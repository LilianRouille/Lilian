name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  xtb:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/cache@v4
        id: c
        with:
          path: xtb-bin
          key: xtb-6.7.1-arm64-v2
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran meson ninja-build git
          git clone --depth 1 --branch v0.3.27 https://github.com/OpenMathLib/OpenBLAS.git
          cd OpenBLAS
          make -j4 TARGET=ARMV8 USE_THREAD=0 USE_OPENMP=0 NO_AFFINITY=1 NO_SHARED=1 NO_LAPACKE=1 FC=gfortran > ../ob.log 2>&1 || { tail -30 ../ob.log; exit 1; }
          make PREFIX=$HOME/ob NO_SHARED=1 install > ../ob-install.log 2>&1 || { tail -30 ../ob-install.log; exit 1; }
          cd ..
          for n in blas lapack; do cp $HOME/ob/lib/pkgconfig/openblas.pc $HOME/ob/lib/pkgconfig/$n.pc; done
          export PKG_CONFIG_PATH=$HOME/ob/lib/pkgconfig
          for n in libblas.a liblapack.a libopenblas.a; do sudo ln -sf $HOME/ob/lib/libopenblas.a /usr/lib/aarch64-linux-gnu/$n; done
          git clone --depth 1 --branch v6.7.1 https://github.com/grimme-lab/xtb.git
          cd xtb
          export FFLAGS="-fallow-argument-mismatch"
          A="--buildtype=release --default-library=static -Dprefer_static=true -Dfortran_link_args=-static -Dc_link_args=-static"
          meson setup build $A \
            || meson setup build --wipe $A -Dlapack=openblas \
            || meson setup build --wipe $A -Dlapack=custom -Dcustom_libraries=openblas \
            || { echo "=== ECHEC CONFIGURATION ==="; tail -30 build/meson-logs/meson-log.txt; exit 1; }
          for d in subprojects/*/; do
            n=$(basename "$d")
            if [ -f "$d/meson.build" ]; then meson configure build -D$n:default_library=static || true; fi
          done
          ninja -C build -k 0 2>&1 | tee ninja.log || true
          echo "=========== ERREURS ==========="
          grep -n -A6 "FAILED:" ninja.log | cut -c1-300 | head -60
          test -f build/xtb
          echo "=== NM ==="; nm build/xtb 2>/dev/null | grep -i mbind | head -5 || true
          strip build/xtb || true
          mkdir -p ../xtb-bin
          cp build/xtb ../xtb-bin/libxtb.so
      - name: Test appels systeme
        run: |
          sudo apt-get install -y strace
          printf '3\n\nO 0.0 0.0 0.0\nH 0.96 0.0 0.0\nH -0.24 0.93 0.0\n' > water.xyz
          chmod +x xtb-bin/libxtb.so
          export GLIBC_TUNABLES=glibc.pthread.rseq=0 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          strace -f -o st.log ./xtb-bin/libxtb.so water.xyz --gfn 2 --opt > out.log 2>&1 || true
          grep -E "TOTAL ENERGY|normal termination" out.log | head -3
          echo "=== MBIND ==="; grep -c mbind st.log || true
          echo "=== SYSCALLS ==="
          sed -E 's/^[0-9]+ +//' st.log | sed -E 's/\(.*//' | sort | uniq -c | sort -rn | awk '{printf "%s ", $2}'
          echo
      - uses: actions/upload-artifact@v4
        with:
          name: xtb-bin
          path: xtb-bin/libxtb.so
  apk:
    needs: xtb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - uses: actions/download-artifact@v4
        with:
          name: xtb-bin
          path: xtb-bin
      - name: Compiler
        run: |
          d=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          mkdir -p "$d/app/src/main/jniLibs/arm64-v8a"
          cp xtb-bin/libxtb.so "$d/app/src/main/jniLibs/arm64-v8a/libxtb.so"
          cd "$d"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Adylase-apk
          path: "**/*.apk"
          if-no-files-found: error
          
