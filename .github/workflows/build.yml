name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  xtb:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/cache@v4
        id: c
        with:
          path: xtb-bin
          key: xtb-6.7.1-arm64-v4
      - uses: actions/cache/restore@v4
        id: lpc
        if: steps.c.outputs.cache-hit != 'true'
        with:
          path: ~/lp
          key: lapack-3.12.0-v1
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran meson ninja-build git cmake
          if [ ! -d "$HOME/lp" ]; then
            git clone --depth 1 --branch v3.12.0 https://github.com/Reference-LAPACK/lapack.git
            cmake -S lapack -B lapack/b -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DLAPACKE=OFF -DCBLAS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_Fortran_COMPILER=gfortran > lp.log 2>&1 || { tail -30 lp.log; exit 1; }
            cmake --build lapack/b -j4 >> lp.log 2>&1 || { tail -30 lp.log; exit 1; }
            cmake --install lapack/b --prefix $HOME/lp >> lp.log 2>&1 || { tail -30 lp.log; exit 1; }
          fi
          BL=$(find $HOME/lp -name '*blas*.a' | head -n 1)
          LA=$(find $HOME/lp -name '*lapack*.a' | grep -v lapacke | head -n 1)
          PC=$(dirname "$(find $HOME/lp -name lapack.pc | head -n 1)")
          echo "BLAS=$BL LAPACK=$LA PC=$PC"
          test -n "$BL" && test -n "$LA"
          STAT=$HOME/lpstat
          rm -rf $STAT; mkdir -p $STAT
          cp "$BL" $STAT/libblas.a
          cp "$LA" $STAT/liblapack.a
          export LIBRARY_PATH=$STAT
          export PKG_CONFIG_PATH=$PC
          sudo ln -sf "$BL" /usr/lib/aarch64-linux-gnu/libblas.a
          sudo ln -sf "$LA" /usr/lib/aarch64-linux-gnu/liblapack.a
          git clone --depth 1 --branch v6.7.1 https://github.com/grimme-lab/xtb.git
          cd xtb
          export FFLAGS="-fallow-argument-mismatch"
          A="--buildtype=release --default-library=static -Dprefer_static=true -Dfortran_link_args=-static -Dc_link_args=-static"
          meson setup build $A \
            || { rm -rf build; meson setup build $A -Dlapack=netlib; } \
            || { echo "=== DIAG ==="; echo "BL=$BL LA=$LA"; ls -l /usr/lib/aarch64-linux-gnu/libblas.a /usr/lib/aarch64-linux-gnu/liblapack.a $STAT; find $HOME/lp -name '*.a'; grep -n -i "blas" build/meson-logs/meson-log.txt | head -25 | cut -c1-250; exit 1; }
          for d in subprojects/*/; do
            n=$(basename "$d")
            if [ -f "$d/meson.build" ]; then meson configure build -D$n:default_library=static || true; fi
          done
          ninja -C build -k 0 2>&1 | tee ninja.log || true
          echo "=========== ERREURS ==========="
          grep -n -A6 "FAILED:" ninja.log | cut -c1-300 | head -60
          test -f build/xtb
          strip build/xtb || true
          mkdir -p ../xtb-bin
          cp build/xtb ../xtb-bin/libxtb.so
      - uses: actions/cache/save@v4
        if: always() && steps.lpc.outputs.cache-hit != 'true'
        with:
          path: ~/lp
          key: lapack-3.12.0-v1
      - uses: actions/upload-artifact@v4
        with:
          name: xtb-bin
          path: xtb-bin/libxtb.so
  apk:
    needs: xtb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - uses: actions/download-artifact@v4
        with:
          name: xtb-bin
          path: xtb-bin
      - name: Sondes
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          cat > probe.c <<'EOF'
          typedef long L;
          static L sc(L n, L a, L b, L c, L d, L e) {
            register L x8 __asm__("x8") = n;
            register L x0 __asm__("x0") = a;
            register L x1 __asm__("x1") = b;
            register L x2 __asm__("x2") = c;
            register L x3 __asm__("x3") = d;
            register L x4 __asm__("x4") = e;
            __asm__ volatile("svc 0" : "+r"(x0) : "r"(x8), "r"(x1), "r"(x2), "r"(x3), "r"(x4) : "memory");
            return x0;
          }
          void cmain(L *sp) {
            L argc = sp[0];
            char **argv = (char **)(sp + 1);
            L n = 0;
            if (argc > 1) { for (char *p = argv[1]; *p; p++) n = n * 10 + (*p - '0'); }
            if (n) sc(n, 0, 0, 0, 0, 0);
            sc(64, 1, (L)"ok\n", 3, 0, 0);
            sc(94, 0, 0, 0, 0, 0);
            for (;;) {}
          }
          __asm__(".global _start\n_start:\n mov x0, sp\n bl cmain\n");
          EOF
          cat > hello.c <<'EOF'
          #include <stdio.h>
          int main(void) { puts("hello"); return 0; }
          EOF
          aarch64-linux-gnu-gcc -static -nostdlib -fno-stack-protector -O1 -o libsysprobe.so probe.c
          aarch64-linux-gnu-gcc -static -O1 -o libhello.so hello.c
          ls -l libsysprobe.so libhello.so
      - name: Compiler
        run: |
          d=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          mkdir -p "$d/app/src/main/jniLibs/arm64-v8a"
          cp xtb-bin/libxtb.so libsysprobe.so libhello.so "$d/app/src/main/jniLibs/arm64-v8a/"
          cd "$d"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Adylase-apk
          path: "**/*.apk"
          if-no-files-found: error
          
